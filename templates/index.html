<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One AI</title>
<link rel="icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
/* ==========================================================================
   One AI — graphite & brass

   Cool graphite surfaces, one warm brass accent. Prose is IBM Plex Sans;
   every piece of instrumentation (timestamps, node names, counts, labels) is
   IBM Plex Mono. That split is the whole type system.
   ========================================================================== */

:root {
    --bg:          #0E1013;
    --surface:     #14181D;
    --raised:      #1B2027;
    --raised-hi:   #232932;
    --line:        #262D37;
    --line-soft:   #1D232B;

    --text:        #E7EAEF;
    --dim:         #98A1AE;
    --faint:       #626C7A;

    --brass:       #D89A4F;
    --brass-on:    #14100A;
    --brass-soft:  rgba(216, 154, 79, 0.14);
    --brass-line:  rgba(216, 154, 79, 0.34);
    --danger:      #DE5C57;
    --ok:          #6BAF92;

    --code-bg:     #12161B;
    --code-head:   #191F26;
    --code-fg:     #D6DAE1;
    --code-dim:    #7C8695;
    --code-line:   #2A313B;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 20px;

    --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
    --sidebar-w: 268px;
}

html[data-theme="light"] {
    --bg:          #F1F3F5;
    --code-fg:     #D6DAE1;
    --code-dim:    #7C8695;
    --code-line:   #2A313B;
    --surface:     #FFFFFF;
    --raised:      #FFFFFF;
    --raised-hi:   #EDF0F3;
    --line:        #DCE1E7;
    --line-soft:   #E7EBEF;

    --text:        #12161B;
    --dim:         #565F6D;
    --faint:       #848D9B;

    --brass:       #9A6A22;
    --brass-on:    #FFFFFF;
    --brass-soft:  rgba(154, 106, 34, 0.10);
    --brass-line:  rgba(154, 106, 34, 0.30);
    --danger:      #C0413C;
    --ok:          #3E7D63;

    --code-bg:     #1B2027;
    --code-head:   #232932;
    --shadow: 0 16px 40px rgba(15, 23, 42, 0.14);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
}

body { display: flex; overflow: hidden; }

::selection { background: var(--brass-soft); }

/* Icons are inline SVG, not an icon font: no extra network request, no flash
   of raw ligature text if a CDN is slow or blocked. */
.ic {
    width: 20px; height: 20px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.ic-sm { width: 16px; height: 16px; }
.ic-dot { stroke-width: 2.4; }
.ic-fill { fill: currentColor; stroke: none; }

/* A single focus treatment for everything. */
:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
    border-radius: var(--r-sm);
}

/* --- Mono metadata: the type signature ----------------------------------- */
.meta {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--faint);
}

/* ==========================================================================
   Sidebar
   ========================================================================== */
#sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    height: 100%;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.24s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 60;
}
#sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); }

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 18px 14px;
}
.brand-mark {
    width: 26px; height: 26px;
    border-radius: 7px;
    border: 1px solid var(--brass-line);
    background: var(--brass-soft);
    display: grid; place-items: center;
    flex-shrink: 0;
}
.brand-mark span {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--brass);
}
.brand-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
}
.brand-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: -2px;
}

.side-pad { padding: 0 12px; }

#new-chat-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: var(--r-md);
    padding: 10px 12px;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.16s, background 0.16s;
}
#new-chat-btn:hover { border-color: var(--brass-line); background: var(--brass-soft); }
#new-chat-btn .ic { color: var(--brass); width: 17px; height: 17px; }

.search-wrap { position: relative; margin: 10px 0 4px; }
.search-wrap .ic {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--faint);
    pointer-events: none;
}
#db-search {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    color: var(--text);
    padding: 9px 10px 9px 33px;
    font-family: var(--sans);
    font-size: 13px;
    outline: none;
    transition: border-color 0.16s;
}
#db-search::placeholder { color: var(--faint); }
#db-search:focus { border-color: var(--brass-line); }

#recent-chats-list {
    flex-grow: 1;
    overflow-y: auto;
    padding: 6px 12px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
}
#recent-chats-list::-webkit-scrollbar { width: 8px; }
#recent-chats-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

.date-group {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 16px 4px 6px;
}
.date-group:first-child { padding-top: 4px; }

.chat-item-container { position: relative; display: flex; align-items: center; gap: 2px; }

.sidebar-btn {
    flex-grow: 1;
    min-width: 0;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--dim);
    border-radius: var(--r-md);
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 13.5px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.14s, color 0.14s;
}
.sidebar-btn:hover { background: var(--raised); color: var(--text); }
.sidebar-btn.active {
    background: var(--raised);
    color: var(--text);
    box-shadow: inset 2px 0 0 var(--brass);
}

.dots-btn {
    background: transparent;
    border: none;
    color: var(--faint);
    cursor: pointer;
    border-radius: var(--r-sm);
    padding: 5px;
    opacity: 0;
    display: flex;
    transition: opacity 0.14s, color 0.14s;
}
.chat-item-container:hover .dots-btn { opacity: 1; }
.dots-btn:hover { color: var(--text); background: var(--raised-hi); }
.dots-btn .ic { width: 17px; height: 17px; }

.action-menu {
    position: absolute;
    top: 34px; right: 4px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow);
    display: none;
    flex-direction: column;
    padding: 4px;
    z-index: 200;
    min-width: 150px;
}
.action-item {
    display: flex;
    align-items: center;
    gap: 9px;
    background: none;
    border: none;
    color: var(--dim);
    text-align: left;
    padding: 8px 10px;
    border-radius: var(--r-sm);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
}
.action-item:hover { background: var(--raised-hi); color: var(--text); }
.action-item .ic { width: 16px; height: 16px; }
.action-item.danger:hover { color: var(--danger); }

.rename-input {
    flex-grow: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--brass-line);
    color: var(--text);
    border-radius: var(--r-md);
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 13.5px;
    outline: none;
}

.side-foot {
    border-top: 1px solid var(--line-soft);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 4px;
}

/* ==========================================================================
   Main column
   ========================================================================== */
#main { flex-grow: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; position: relative; }

.top-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--bg);
    z-index: 40;
}
.top-title {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.spacer { flex-grow: 1; }

.icon-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--dim);
    border-radius: var(--r-md);
    width: 34px; height: 34px;
    display: grid;
    place-items: center;
    cursor: pointer;
    position: relative;
    transition: background 0.14s, color 0.14s, border-color 0.14s;
    flex-shrink: 0;
}
.icon-btn:hover { background: var(--raised); color: var(--text); }
.icon-btn[disabled] { opacity: 0.35; cursor: default; }
.icon-btn[disabled]:hover { background: transparent; color: var(--dim); }

/* Tooltips: no motion, just an instant label. */
.tt { position: relative; }
.tt::after {
    content: attr(data-tt);
    position: absolute;
    top: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--raised);
    border: 1px solid var(--line);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: var(--r-sm);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s;
    z-index: 300;
}
.tt:hover::after, .tt:focus-visible::after { opacity: 1; }
.tt.tt-left::after { left: auto; right: 0; transform: none; }

.temp-toggle { display: flex; align-items: center; gap: 8px; padding-left: 6px; }
.temp-toggle label { cursor: pointer; }
.switch { position: relative; display: inline-block; width: 34px; height: 19px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; inset: 0;
    background: var(--raised-hi);
    border: 1px solid var(--line);
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s;
}
.slider::before {
    content: "";
    position: absolute;
    height: 13px; width: 13px;
    left: 2px; top: 2px;
    background: var(--faint);
    border-radius: 50%;
    transition: transform 0.18s, background 0.18s;
}
.switch input:checked + .slider { background: var(--brass-soft); border-color: var(--brass-line); }
.switch input:checked + .slider::before { transform: translateX(15px); background: var(--brass); }
.switch input:focus-visible + .slider { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ==========================================================================
   Transcript
   ========================================================================== */
#chat-container {
    flex-grow: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
}
#chat-container::-webkit-scrollbar { width: 10px; }
#chat-container::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }

#chat-box {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 30px;
}

.message-block { display: flex; flex-direction: column; animation: rise 0.26s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* --- User turn --- */
.user-block { align-items: flex-end; }
.user-bubble {
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: var(--r-xl);
    border-bottom-right-radius: var(--r-sm);
    padding: 12px 17px;
    max-width: 84%;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
}

/* --- Assistant turn --- */
.ai-block { align-items: stretch; }
.ai-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 9px;
}
.ai-content { font-size: 15.5px; line-height: 1.68; color: var(--text); }
.ai-content > *:first-child { margin-top: 0; }
.ai-content > *:last-child { margin-bottom: 0; }
.ai-content h1, .ai-content h2, .ai-content h3 {
    font-weight: 600;
    letter-spacing: -0.012em;
    line-height: 1.3;
    margin: 26px 0 10px;
}
.ai-content h1 { font-size: 1.32em; }
.ai-content h2 { font-size: 1.18em; }
.ai-content h3 { font-size: 1.05em; }
.ai-content p { margin: 0 0 14px; }
.ai-content ul, .ai-content ol { margin: 0 0 14px; padding-left: 22px; }
.ai-content li { margin-bottom: 6px; }
.ai-content li::marker { color: var(--faint); }
.ai-content a { color: var(--brass); text-underline-offset: 3px; }
.ai-content strong { font-weight: 600; }
.ai-content hr { border: none; border-top: 1px solid var(--line); margin: 22px 0; }
.ai-content blockquote {
    border-left: 2px solid var(--brass-line);
    margin: 14px 0;
    padding: 2px 0 2px 16px;
    color: var(--dim);
}
.ai-content :not(pre) > code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--raised);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-sm);
    padding: 1.5px 5px;
}
.ai-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    font-size: 0.93em;
}
.ai-content th, .ai-content td {
    border: 1px solid var(--line);
    padding: 8px 12px;
    text-align: left;
}
.ai-content th {
    background: var(--raised);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--dim);
}

/* --- Code blocks --- */
.code-container {
    background: var(--code-bg);
    border: 1px solid var(--code-line);
    color: var(--code-fg);
    border-radius: var(--r-md);
    overflow: hidden;
    margin: 16px 0;
}
.code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--code-head);
    border-bottom: 1px solid var(--code-line);
    padding: 7px 12px;
}
.code-lang {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--code-dim);
}
.copy-code-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--code-dim);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: var(--r-sm);
}
.copy-code-btn:hover { color: var(--code-fg); background: rgba(255,255,255,0.07); }
.copy-code-btn .ic { width: 13px; height: 13px; }
.code-container pre {
    margin: 0 !important;
    background: transparent !important;
    padding: 14px 16px !important;
    overflow-x: auto;
    font-size: 13px !important;
    line-height: 1.62 !important;
}
.code-container code,
.code-container code[class*="language-"] {
    font-family: var(--mono) !important;
    background: transparent !important;
    color: var(--code-fg) !important;
    text-shadow: none !important;
}
.code-container .token.comment { color: #6C7686 !important; }

/* ==========================================================================
   Consensus strip — the signature element

   While generating this is the progress readout; when finished it is the
   receipt. Same row, two states: which nodes answered, and how long it took.
   ========================================================================== */
.consensus {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 11px;
    border-top: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: var(--faint);
}
.node-pips { display: flex; gap: 4px; }
.node-pip {
    width: 16px; height: 3px;
    border-radius: 2px;
    background: var(--line);
    transition: background 0.5s ease;
}
.node-pip.done { background: var(--brass); }
.node-pip.pending { background: var(--line); animation: breathe 1.5s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
.consensus-label { text-transform: uppercase; }
.consensus-timer { color: var(--dim); font-variant-numeric: tabular-nums; }
.consensus-flag { color: var(--brass); text-transform: uppercase; }
.consensus .sep { color: var(--line); }

/* --- Message toolbar --- */
.gemini-toolbar {
    display: flex;
    gap: 2px;
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.16s;
}
.message-block:hover .gemini-toolbar, .gemini-toolbar:focus-within { opacity: 1; }
.user-block .gemini-toolbar { justify-content: flex-end; }

.action-btn-icon {
    background: transparent;
    border: none;
    color: var(--faint);
    border-radius: var(--r-sm);
    width: 28px; height: 28px;
    display: grid;
    place-items: center;
    cursor: pointer;
    position: relative;
    transition: background 0.14s, color 0.14s;
}
.action-btn-icon:hover { background: var(--raised); color: var(--text); }
.action-btn-icon .ic { width: 16px; height: 16px; }

/* ==========================================================================
   Empty state
   ========================================================================== */
.hero-platform {
    padding: 12vh 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.hero-title {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.025em;
    margin: 0 0 10px;
}
.hero-sub {
    color: var(--dim);
    font-size: 14.5px;
    max-width: 400px;
    margin: 0 0 34px;
    line-height: 1.6;
}
.suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
    max-width: 540px;
}
.suggestion {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: var(--r-md);
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.45;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.16s, color 0.16s, background 0.16s;
}
.suggestion:hover { border-color: var(--brass-line); color: var(--text); background: var(--brass-soft); }

/* ==========================================================================
   Composer
   ========================================================================== */
#input-outer {
    padding: 0 24px 22px;
    background: linear-gradient(to top, var(--bg) 62%, transparent);
    position: relative;
    z-index: 30;
}
.composer { max-width: 760px; margin: 0 auto; }

#attach-tray { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 9px; }
.att-card {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 6px 10px 6px 6px;
    max-width: 240px;
    position: relative;
    overflow: hidden;
}
.att-card.uploading { opacity: 0.6; }
.att-thumb {
    width: 32px; height: 32px;
    border-radius: var(--r-sm);
    object-fit: cover;
    flex-shrink: 0;
    background: var(--raised);
    display: grid;
    place-items: center;
    color: var(--faint);
}
.att-thumb .ic { width: 16px; height: 16px; }
.att-meta { min-width: 0; }
.att-name {
    font-size: 12.5px;
    color: var(--text);
    white-space: nowrap;

"use strict";

/* ---------------------------------------------------------------------------

/** Pull a path out of a leading comment, e.g. "# app/models.py". */
function detectFilename(source, lang) {
    const first = String(source).split('\n', 1)[0].trim();
    const m = first.match(/^(?:#|\/\/|--|<!--)\s*([\w./-]+\.[A-Za-z0-9]{1,6})\s*(?:-->)?$/);
    return m ? m[1] : '';
}

function downloadText(text, filename) {
    try {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('Saved ' + filename);
    } catch (_) {
        toast('Could not save that file.', true);
    }
}

function icon(name, size) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('class', 'ic' + (size && size <= 16 ? ' ic-sm' : '')
                            + (DOT_ICONS[name] ? ' ic-dot' : '')
                            + (name === 'stop' ? ' ic-fill' : ''));
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', ICON_PATHS[name] || ICON_PATHS.file);
    svg.append(path);
    return svg;
}

/* Replace the placeholder spans in the static markup with real SVG. */

        const svg = icon(span.dataset.icon);
        if (span.id) svg.id = span.id;
        svg.dataset.icon = span.dataset.icon;

}

let toastTimer = null;
function toast(message, isError) {
    els.toast.textContent = message;
    els.toast.classList.toggle('error', !!isError);
    els.toast.classList.add('show');

/** Every network call goes through here so errors are handled in one place. */
async function api(path, options) {
    const res = await fetch(path, options);
    let payload = null;
    try { payload = await res.json(); } catch (_) { /* non-JSON body */ }
    if (!res.ok) {
        const message = (payload && payload.error) || `Request failed (${res.status})`;
        throw new Error(message);
    }
    return payload;
}

/**
 * Render markdown, then sanitise. The previous version injected raw model and
 * user text straight into innerHTML, so a message containing an <img onerror>
 * tag would execute script in the page.
 */
function renderMarkdown(raw) {
    const text = String(raw ?? '');
    const holder = document.createElement('div');

    // If either CDN library failed to load, fall back to plain text rather
    // than throwing. An unstyled answer beats a blank screen, and skipping
    // innerHTML entirely means the fallback path cannot be an injection route.
    if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
        text.split(/\n{2,}/).forEach((para) => {
            const p = document.createElement('p');
            p.style.whiteSpace = 'pre-wrap';
            p.textContent = para;
            holder.append(p);
        });
        return holder;
    }

    const dirty = marked.parse(text, { breaks: true, gfm: true });
    const clean = DOMPurify.sanitize(dirty, { USE_PROFILES: { html: true } });
    holder.innerHTML = clean;

    holder.querySelectorAll('pre code').forEach((code) => {
        const pre = code.parentElement;
        let lang = 'code';
        code.classList.forEach((c) => { if (c.startsWith('language-')) lang = c.slice(9); });

        const wrap = document.createElement('div');
        wrap.className = 'code-container';

        const header = document.createElement('div');
        header.className = 'code-header';
        const label = document.createElement('span');
        label.className = 'code-lang';
        label.textContent = lang;
        header.append(label);

        const source = code.textContent;

        // Models often put the path in a leading comment. Lifting it into the
        // header makes it obvious which file a block belongs to.
        const filename = detectFilename(source);
        if (filename) {
            const name = document.createElement('span');
            name.className = 'code-file';
            name.textContent = filename;
            header.append(name);
        }

        const actions = document.createElement('span');
        actions.className = 'code-actions';

        const dlBtn = document.createElement('button');
        dlBtn.className = 'copy-code-btn';
        dlBtn.type = 'button';
        dlBtn.title = 'Download this block';
        dlBtn.setAttribute('aria-label', 'Download this block');
        dlBtn.append(icon('download', 14));
        dlBtn.addEventListener('click', () =>
            downloadText(source, filename || ('snippet.' + extFor(lang))));

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.type = 'button';
        copyBtn.append(icon('copy', 14), document.createTextNode('Copy'));
        copyBtn.addEventListener('click', () => copyCode(copyBtn, source));

        actions.append(dlBtn, copyBtn);
        header.append(actions);
        pre.replaceWith(wrap);
        wrap.append(header, pre);
    });

    holder.querySelectorAll('a[href]').forEach((a) => {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
    });

    return holder;
}

function toolbarButton(iconName, label, onClick) {

        toast('Copying needs a secure connection. Open the site over HTTPS.', true);
    }
}

async function copyCode(btn, text) {
    try {
        await navigator.clipboard.writeText(text);
        btn.textContent = '';
        btn.append(icon('check', 14), document.createTextNode('Copied'));
        setTimeout(() => {
            btn.textContent = '';
            btn.append(icon('copy', 14), document.createTextNode('Copy'));
        }, 1800);
    } catch (_) {
        toast('Copying needs a secure connection. Open the site over HTTPS.', true);
    }
}

function speak(text) {
    if (!synth) return;
    if (synth.speaking) { synth.cancel(); return; }
    synth.speak(new SpeechSynthesisUtterance(String(text).replace(/[#*`_>]/g, '')));

   Remembered in localStorage, and defaults to the OS preference. This is a
   real page, not a sandboxed artifact, so localStorage is available.

function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const next = theme === 'light' ? 'moon' : 'sun';
    const target = document.getElementById('theme-icon');
    if (target) {
        target.querySelector('path').setAttribute('d', ICON_PATHS[next]);

        target.dataset.icon = next;
    }
    try { localStorage.setItem('oneai-theme', theme); } catch (_) {}
}

/* ---------------------------------------------------------------------------
   Free-tier budget

   OpenRouter's free tier caps requests per day, and panel mode spends four per
   message. Without a counter you discover the cap by being cut off mid-task.
   Counted client-side per day: approximate, but enough to pace yourself.
--------------------------------------------------------------------------- */
const budget = { used: 0, limit: 200, day: '' };

function todayKey() {
    return new Date().toISOString().slice(0, 10);
}

function loadBudget() {
    try {
        const raw = JSON.parse(localStorage.getItem('oneai-budget') || '{}');
        if (raw.day === todayKey()) budget.used = raw.used || 0;
        else budget.used = 0;
    } catch (_) { budget.used = 0; }
    budget.day = todayKey();
    renderBudget();
}

function spendBudget(n) {
    if (budget.day !== todayKey()) { budget.used = 0; budget.day = todayKey(); }
    budget.used += n || 1;
    try {
        localStorage.setItem('oneai-budget', JSON.stringify({ day: budget.day, used: budget.used }));
    } catch (_) {}
    renderBudget();
}

function renderBudget() {
    const pct = Math.min(100, (budget.used / budget.limit) * 100);
    const fill = document.getElementById('budget-fill');
    const text = document.getElementById('budget-text');
    const wrap = document.getElementById('budget-meter');
    if (!fill) return;
    fill.style.width = pct + '%';
    text.textContent = `${budget.used}/${budget.limit}`;
    wrap.classList.toggle('warn', pct >= 80);
    wrap.dataset.tt = `${budget.used} of about ${budget.limit} free requests used today`;
}

   window.confirm and window.prompt block the whole page, look nothing like the
   rest of the UI, and are suppressed outright by some mobile browsers.
--------------------------------------------------------------------------- */
let dialogResolve = null;

function closeDialog(value) {
    els.backdrop.classList.remove('show');
    els.dialogBody.textContent = '';
    els.dialogActions.textContent = '';
    if (dialogResolve) { const r = dialogResolve; dialogResolve = null; r(value); }
}

function openDialog(title, buildBody, buttons) {
    els.dialogTitle.textContent = title;
    els.dialogBody.textContent = '';
    els.dialogActions.textContent = '';
    buildBody(els.dialogBody);

    buttons.forEach((spec) => {
        const btn = document.createElement('button');
        btn.className = 'btn' + (spec.variant ? ' ' + spec.variant : '');
        btn.type = 'button';
        btn.textContent = spec.label;
        btn.addEventListener('click', () => closeDialog(spec.value));
        els.dialogActions.append(btn);
    });

    els.backdrop.classList.add('show');
    const focusTarget = els.dialogBody.querySelector('input, textarea')
                     || els.dialogActions.querySelector('.btn.primary, .btn.danger')
                     || els.dialogActions.lastElementChild;
    if (focusTarget) focusTarget.focus();

    return new Promise((resolve) => { dialogResolve = resolve; });
}

function confirmDialog(title, message, confirmLabel, variant) {
    return openDialog(title, (body) => {
        const p = document.createElement('p');
        p.textContent = message;
        body.append(p);
    }, [
        { label: 'Cancel', value: false },
        { label: confirmLabel || 'Confirm', value: true, variant: variant || 'primary' },
    ]);
}

els.backdrop.addEventListener('click', (e) => { if (e.target === els.backdrop) closeDialog(null); });

        ['Ctrl / \u2318 + B', 'Toggle sidebar'],

    if (nodes !== undefined) addConsensusStrip(block, nodes, seconds, degraded, extra);

/**
 * A four-call round trip can take 90 seconds. A frozen spinner for that long
 * reads as a hang, so show elapsed time and mark the panel nodes as they land.
 */
/* ---------------------------------------------------------------------------
   The consensus strip

   One component with two states. While an answer is being generated it is the
   progress readout; once the answer lands it stays put as the receipt for that
   answer -- which nodes contributed and how long the synthesis took.

   Honest about its own precision: the elapsed timer is measured, but the pips
   advance on a schedule, because without streaming the server sends no
   per-node signal. The timer is what proves it has not hung.
--------------------------------------------------------------------------- */
function buildStrip() {
    const strip = document.createElement('div');
    strip.className = 'consensus';

    const pips = document.createElement('span');
    pips.className = 'node-pips';
    for (let i = 0; i < 3; i++) {
        const pip = document.createElement('span');
        pip.className = 'node-pip';
        pips.append(pip);
    }

    const label = document.createElement('span');
    label.className = 'consensus-label';

    strip.append(pips, label);
    return { strip, pips, label };
}

function startProgress(block) {
    const content = block.querySelector('.ai-content');
    content.style.opacity = '1';
    content.textContent = '';

    block.querySelectorAll('.consensus, .gemini-toolbar').forEach((e) => e.remove());

    const { strip, pips, label } = buildStrip();
    Array.from(pips.children).forEach((p) => p.classList.add('pending'));
    label.textContent = state.mode === 'panel' ? 'Querying panel' : 'Generating';
    if (state.mode !== 'panel') {
        pips.textContent = '';
        const one = document.createElement('span');
        one.className = 'node-pip pending';
        pips.append(one);
    }

    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = '/';

    const timer = document.createElement('span');
    timer.className = 'consensus-timer';
    timer.textContent = '0s';
    strip.append(sep, timer);

    // The strip sits where the answer will appear, then stays for the receipt.
    strip.style.borderTop = 'none';
    strip.style.paddingTop = '0';
    strip.style.marginTop = '0';
    content.append(strip);

    const started = Date.now();
    const stages = state.mode === 'panel' ? [
        [7000,  'Reasoning node in'],
        [18000, 'Technical node in'],
        [30000, 'Reconciling answers'],
        [65000, 'Still working — free models queue at peak times'],
    ] : [
        [12000, 'Writing'],
        [40000, 'Long answer — still generating'],
        [75000, 'Still working — free models queue at peak times'],
    ];
    let stage = 0;

    const handle = setInterval(() => {
        const elapsed = Date.now() - started;
        timer.textContent = Math.floor(elapsed / 1000) + 's';
        while (stage < stages.length && elapsed > stages[stage][0]) {
            label.textContent = stages[stage][1];
            const pip = pips.children[Math.min(stage, 2)];
            if (pip) { pip.classList.remove('pending'); pip.classList.add('done'); }
            stage++;
        }
    }, 500);

    return () => {
        clearInterval(handle);
        return Math.round((Date.now() - started) / 1000);
    };
}

function addConsensusStrip(block, nodes, seconds, degraded, extra) {
    const info = extra || {};
    const { strip, pips, label } = buildStrip();
    const count = (nodes || []).length;
    const mode = info.mode || (count ? 'panel' : 'direct');

    if (mode === 'panel') {
        Array.from(pips.children).forEach((pip, i) => {
            if (i < count) pip.classList.add('done');
        });
        label.textContent = `${count} of 3 nodes · reconciled`;
    } else {
        // One model answered. Showing three pips would imply a panel ran.
        pips.textContent = '';
        const single = document.createElement('span');
        single.className = 'node-pip done';
        pips.append(single);
        label.textContent = mode === 'code' ? 'Code · single model' : 'Direct · single model';
    }

    strip.append(label);

    // The auto-router's id is 'openrouter/free', which renders as a bare "free"
    // and tells you nothing. Name it for what it is instead.
    if (info.model) {
        const label = info.model === 'openrouter/free'
            ? 'auto'
            : String(info.model).split('/').pop().replace(':free', '');
        const sepM = document.createElement('span');
        sepM.className = 'sep';
        sepM.textContent = '/';
        const name = document.createElement('span');
        name.textContent = label;
        strip.append(sepM, name);
    }

    if (seconds) {
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '/';
        const timer = document.createElement('span');
        timer.className = 'consensus-timer';
        timer.textContent = seconds + 's';
        strip.append(sep, timer);
    }

    if (info.truncated) {
        const sepT = document.createElement('span');
        sepT.className = 'sep';
        sepT.textContent = '/';
        const flag = document.createElement('span');
        flag.className = 'consensus-flag';
        flag.textContent = 'Output limit reached';
        strip.append(sepT, flag);
    }

    if (mode === 'panel' && (degraded || (count && count < 3))) {
        const sep2 = document.createElement('span');
        sep2.className = 'sep';
        sep2.textContent = '/';
        const flag = document.createElement('span');
        flag.className = 'consensus-flag';
        flag.textContent = 'Partial panel';
        strip.append(sep2, flag);
    }

    block.append(strip);
}

function isAbort(err) {
    return err && (err.name === 'AbortError' || err.message === 'cancelled');
}

function showMessageError(block, message, onRetry) {
    const content = block.querySelector('.ai-content');
    content.style.opacity = '1';
    content.textContent = '';
    const p = document.createElement('p');
    p.className = 'error-text';
    p.textContent = message;
    content.append(p);
    if (onRetry) {
        const retry = document.createElement('button');
        retry.className = 'btn';
        retry.type = 'button';
        retry.textContent = 'Retry';
        retry.addEventListener('click', onRetry);
        content.append(retry);
    }
}

function stopGenerating() {
    if (state.controller) {
        state.controller.abort();
        state.controller = null;
        toast('Stopped');
    }
}

async function send() {
    if (state.sending) return;
    if (state.uploading) { toast('Wait for the upload to finish', true); return; }

    const typed = els.input.value.trim();
    const ready = state.attachments.filter((a) => a.id);
    if (!typed && !ready.length) return;

    const prompt = typed || 'Please review the attached file(s).';
    const ephemeral = els.tempMode.checked;
    const sentAtts = ready.map((a) => ({
        id: a.id, name: a.name, kind: a.kind, data_url: a.thumbnail || '',
    }));

    clearHero();
    const userBlock = addUserMessage(typed || '(no message)', sentAtts);
    els.input.value = '';
    autoGrow();
    clearAttachments();

    const pending = addAiMessage(null, prompt, { pending: true });
    setBusy(true);
    const stopProgress = startProgress(pending);
    anchorScroll(true);

    state.controller = new AbortController();
    const payload = {
        message: prompt,
        chat_id: ephemeral ? 'temp' : state.currentId,
        attachment_ids: ready.map((a) => a.id),
        mode: state.mode,
    };

    try {
        if (state.streaming && state.mode !== 'panel') {
            await streamAnswer(payload, pending, userBlock, stopProgress, prompt);
            return;
        }

        const data = await api('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: state.controller.signal,
        });

        const seconds = stopProgress();
        spendBudget(data.requests || (state.mode === 'panel' ? 4 : 1));
        if (data.user_message_id) userBlock.dataset.messageId = data.user_message_id;
        setAiContent(pending, data.master_answer, prompt, data.nodes,
                     data.message_id, seconds, data.degraded, data);

        if (!ephemeral) {
            if (!state.currentId) state.currentId = data.chat_id;
            syncExportButton();
            loadSidebar();
        }
    } catch (err) {
        stopProgress();
        if (isAbort(err)) {
            pending.remove();
            els.input.value = typed;
            autoGrow();
        } else {
            showMessageError(pending, err.message, () => {
                pending.remove();
                els.input.value = typed;
                autoGrow();
                if (sentAtts.length) toast('Re-attach your files before retrying.', true);
                send();
            });
            toast(err.message, true);
        }
    } finally {
        state.controller = null;
        setBusy(false);
        anchorScroll();
    }
}

/* ---------------------------------------------------------------------------
   Streaming

   Server-sent events, read straight off the fetch body. Text is appended as
   plain text while streaming and re-rendered as markdown once complete, so a
   half-finished code fence never renders as broken HTML mid-stream.
--------------------------------------------------------------------------- */
async function streamAnswer(payload, block, userBlock, stopProgress, prompt) {
    const res = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: state.controller.signal,
    });

    if (!res.ok || !res.body) {
        let detail = `Streaming failed (${res.status})`;
        try { const j = await res.json(); if (j.error) detail = j.error; } catch (_) {}
        throw new Error(detail);
    }

    const content = block.querySelector('.ai-content');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    let buffer = '';
    let answer = '';
    let started = false;
    let finished = null;
    const caret = document.createElement('span');
    caret.className = 'stream-caret';

    const pre = document.createElement('div');
    pre.style.whiteSpace = 'pre-wrap';

    const handle = (name, data) => {
        if (name === 'start') {
            if (data.user_message_id) userBlock.dataset.messageId = data.user_message_id;
            if (!state.currentId && data.chat_id !== 'temp') state.currentId = data.chat_id;
        } else if (name === 'chunk') {
            if (!started) {
                started = true;
                stopProgress();
                content.textContent = '';
                content.append(pre, caret);
            }
            answer += data.text;
            pre.textContent = answer;
            anchorScroll();
        } else if (name === 'done') {
            finished = data;
        } else if (name === 'error') {
            throw new Error(data.message);
        }
    };

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let split;
        while ((split = buffer.indexOf('\n\n')) !== -1) {
            const raw = buffer.slice(0, split);
            buffer = buffer.slice(split + 2);
            const nameLine = raw.match(/^event: (.+)$/m);
            const dataLine = raw.match(/^data: (.+)$/m);
            if (!nameLine || !dataLine) continue;
            handle(nameLine[1], JSON.parse(dataLine[1]));
        }
    }

    caret.remove();
    const seconds = stopProgress();
    spendBudget(1);

    if (!answer.trim()) throw new Error('The model returned nothing.');

    setAiContent(block, answer, prompt, (finished && finished.nodes) || [],
                 finished && finished.message_id, (finished && finished.seconds) || seconds,
                 false, finished || {});
    if (finished && finished.partial_error) toast(finished.partial_error, true);
    syncExportButton();
    loadSidebar();
}

/**
 * Regenerate replaces the assistant message server-side. The earlier version
 * re-POSTed to /api/chat, which appended a whole new exchange to the database
 * each time while the UI swapped the answer in place -- so the saved transcript
 * silently accumulated duplicates.
 */
async function regenerate(prompt, block) {
    if (state.sending) return;
    const messageId = Number(block.dataset.messageId);

    if (!messageId || !state.currentId) {
        toast('This message cannot be regenerated.', true);
        return;
    }

    setBusy(true);
    const stopProgress = startProgress(block);
    state.controller = new AbortController();
    try {
        const data = await api(`/api/chats/${state.currentId}/regenerate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message_id: messageId, mode: state.mode }),
            signal: state.controller.signal,
        });
        const seconds = stopProgress();
        spendBudget(data.requests || (state.mode === 'panel' ? 4 : 1));
        setAiContent(block, data.master_answer, prompt, data.nodes,
                     data.message_id, seconds, data.degraded, data);
    } catch (err) {
        stopProgress();
        if (isAbort(err)) {
            setAiContent(block, '*Regeneration stopped.*', prompt, [], messageId);
        } else {
            showMessageError(block, err.message, () => regenerate(prompt, block));
            toast(err.message, true);
        }
    } finally {
        state.controller = null;
        setBusy(false);
        anchorScroll();
    }
}

/* ---------------------------------------------------------------------------
   Editing a sent message

   Editing rewrites the message and drops everything after it, which is what
   people expect: the conversation branches from the edit rather than growing a
   contradictory second copy.
--------------------------------------------------------------------------- */
function beginEdit(block, originalText) {
    if (state.sending) return;
    const messageId = Number(block.dataset.messageId);
    if (!messageId || !state.currentId) {
        // Unsaved or temporary chat: fall back to refilling the composer.
        els.input.value = originalText;
        autoGrow();
        els.input.focus();
        return;
    }
    if (state.editing) cancelEdit();
    state.editing = messageId;

    const bubble = block.querySelector('.user-bubble');
    const toolbar = block.querySelector('.gemini-toolbar');
    bubble.style.display = 'none';
    if (toolbar) toolbar.style.display = 'none';

    const box = document.createElement('div');
    box.className = 'editing-box';
    const area = document.createElement('textarea');
    area.value = originalText;
    area.setAttribute('aria-label', 'Edit your message');

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:8px;';
    const cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.type = 'button';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', cancelEdit);
    const save = document.createElement('button');
    save.className = 'btn primary';
    save.type = 'button';
    save.textContent = 'Save & resend';
    save.addEventListener('click', () => submitEdit(block, area.value));
    actions.append(cancel, save);

    area.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitEdit(block, area.value); }
        if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });

    box.append(area, actions);
    block.append(box);
    area.focus();
    area.setSelectionRange(area.value.length, area.value.length);
    area.style.height = Math.min(area.scrollHeight, 240) + 'px';
}

function cancelEdit() {
    state.editing = null;
    document.querySelectorAll('.editing-box').forEach((b) => b.remove());
    document.querySelectorAll('.user-block').forEach((block) => {
        const bubble = block.querySelector('.user-bubble');
        const toolbar = block.querySelector('.gemini-toolbar');
        if (bubble) bubble.style.display = '';
        if (toolbar) toolbar.style.display = '';
    });
}

async function submitEdit(block, text) {
    const value = text.trim();
    if (!value) { toast('Message cannot be empty.', true); return; }
    const messageId = Number(block.dataset.messageId);
    cancelEdit();

    // Everything after the edited message is about to be replaced.
    let node = block.nextElementSibling;
    while (node) { const next = node.nextElementSibling; node.remove(); node = next; }

    block.querySelector('.user-bubble').textContent = value;

    const pending = addAiMessage(null, value, { pending: true });
    setBusy(true);
    const stopProgress = startProgress(pending);
    state.controller = new AbortController();
    try {
        const data = await api(`/api/chats/${state.currentId}/edit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message_id: messageId, message: value, mode: state.mode }),
            signal: state.controller.signal,
        });
        const seconds = stopProgress();
        spendBudget(data.requests || (state.mode === 'panel' ? 4 : 1));
        block.dataset.messageId = data.user_message_id;
        setAiContent(pending, data.master_answer, value, data.nodes,
                     data.message_id, seconds, data.degraded, data);
        loadSidebar();
    } catch (err) {
        stopProgress();
        if (isAbort(err)) pending.remove();
        else { showMessageError(pending, err.message, null); toast(err.message, true); }
    } finally {
        state.controller = null;
        setBusy(false);
        anchorScroll();
    }
}

/* ---------------------------------------------------------------------------
   Sidebar / history
--------------------------------------------------------------------------- */
function dateGroup(iso) {
    if (!iso) return 'Earlier';
    // SQLite writes "YYYY-MM-DD HH:MM:SS" in UTC with no zone marker; without
    // the Z, browsers parse it as local time and the grouping drifts.
    const when = new Date(iso.replace(' ', 'T') + (/[Z+]/.test(iso) ? '' : 'Z'));
    if (isNaN(when)) return 'Earlier';

    const startOfToday = new Date();
    startOfToday.setHours(0, 0, 0, 0);
    const days = Math.floor((startOfToday - when) / 86400000);

    if (days <= 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7) return 'Previous 7 days';
    if (days < 30) return 'Previous 30 days';
    return 'Older';
}

function renderSidebar(chats) {
    state.chats = chats;
    els.recentList.textContent = '';
    if (!chats.length) {
        const empty = document.createElement('div');
        empty.className = 'meta';
        empty.style.cssText = 'padding: 14px 6px; text-transform: none; letter-spacing: 0;';
        empty.textContent = 'Conversations you start will appear here.';
        els.recentList.append(empty);
        return;
    }

    let currentGroup = null;
    chats.forEach((c) => {
        const group = dateGroup(c.updated_at);
        if (group !== currentGroup) {
            currentGroup = group;
            const heading = document.createElement('div');
            heading.className = 'date-group';
            heading.textContent = group;
            els.recentList.append(heading);
        }

        const row = document.createElement('div');
        row.className = 'chat-item-container';

        const open = document.createElement('button');
        open.className = 'sidebar-btn' + (c.id === state.currentId ? ' active' : '');
        open.type = 'button';
        open.textContent = c.title;   // textContent: titles are user data
        open.addEventListener('click', () => loadChat(c.id));

        const dots = document.createElement('button');
        dots.className = 'dots-btn';
        dots.type = 'button';
        dots.append(icon('more'));
        dots.setAttribute('aria-label', 'Chat options');

        const menu = document.createElement('div');
        menu.className = 'action-menu';

        const renameBtn = document.createElement('button');
        renameBtn.className = 'action-item';
        renameBtn.type = 'button';
        renameBtn.append(icon('edit'), document.createTextNode('Rename'));
        renameBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeAllMenus();
            beginRename(row, open, c);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'action-item danger';
        deleteBtn.type = 'button';
        deleteBtn.append(icon('delete'), document.createTextNode('Delete'));
        deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteChat(c.id); });

        menu.append(renameBtn, deleteBtn);
        dots.addEventListener('click', (e) => {
            e.stopPropagation();
            const wasOpen = menu.style.display === 'flex';
            closeAllMenus();
            menu.style.display = wasOpen ? 'none' : 'flex';
        });

        row.append(open, dots, menu);
        els.recentList.append(row);
    });
}

async function loadSidebar() {
    try {
        renderSidebar(await api('/api/chats'));
    } catch (err) {
        toast(err.message, true);
    }
}

let searchTimer = null;
function onSearch(value) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
        try {
            if (!value.trim()) { loadSidebar(); return; }
            renderSidebar(await api('/api/chats/search?q=' + encodeURIComponent(value)));
        } catch (err) {
            toast(err.message, true);
        }
    }, 250);   // debounce: the original fired a query on every keystroke
}

async function loadChat(id) {
    try {
        const msgs = await api('/api/chats/' + id);
        state.currentId = id;
        const entry = (state.chats || []).find((c) => c.id === id);
        els.topTitle.textContent = entry ? entry.title : 'Conversation';
        els.chatBox.textContent = '';
        clearHero();

        let lastPrompt = '';
        msgs.forEach((m) => {
            if (m.role === 'user') {
                lastPrompt = m.content;
                addUserMessage(m.content, m.attachments, m.id);
            } else {
                const meta = m.meta || {};
                addAiMessage(m.content, lastPrompt, {
                    messageId: m.id,
                    nodes: meta.nodes,
                    seconds: meta.seconds,
                    degraded: meta.degraded,
                    extra: meta,
                });
            }
        });
        loadSidebar();
        syncExportButton();
        anchorScroll(true);
    } catch (err) {
        toast(err.message, true);
    }
}

function beginRename(row, button, chat) {
    const input = document.createElement('input');
    input.className = 'rename-input';
    input.value = chat.title;
    input.setAttribute('aria-label', 'Chat title');
    button.style.display = 'none';
    row.insertBefore(input, row.firstChild);
    input.focus();
    input.select();

    let settled = false;
    const finish = async (save) => {
        if (settled) return;
        settled = true;
        const title = input.value.trim();
        input.remove();
        button.style.display = '';
        if (!save) return;
        if (!title) { toast('Title cannot be empty.', true); return; }
        if (title === chat.title) return;
        try {
            await api('/api/chats/' + chat.id, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title }),
            });
            loadSidebar();
        } catch (err) {
            toast(err.message, true);
        }
    };

    input.addEventListener('click', (e) => e.stopPropagation());
    input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') finish(true);
        if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
}

async function deleteChat(id) {
    const ok = await confirmDialog(
        'Delete this chat?',
        'The conversation and any files attached to it will be permanently removed. This cannot be undone.',
        'Delete', 'danger');
    if (!ok) return;
    try {
        await api('/api/chats/' + id, { method: 'DELETE' });
        if (state.currentId === id) newChat();
        loadSidebar();
        toast('Chat deleted');
    } catch (err) {
        toast(err.message, true);
    }
}

const SUGGESTIONS = [
    'Review this code and flag anything that will break',
    'Summarise this document and pull out the decisions',
    'Explain what this error means and how to fix it',
    'Compare two approaches and tell me which to pick',
];

function buildHero() {
    const hero = document.createElement('div');
    hero.id = 'hero-container';
    hero.className = 'hero-platform';

    const h2 = document.createElement('h2');
    h2.className = 'hero-title';
    h2.textContent = 'Ask anything';
    hero.append(h2);

    const sub = document.createElement('p');
    sub.className = 'hero-sub';
    sub.textContent = 'Three models answer independently. A fourth reconciles '
                    + 'them into one response.';
    hero.append(sub);

    const wrap = document.createElement('div');
    wrap.className = 'suggestions';
    SUGGESTIONS.forEach((text) => {
        const chip = document.createElement('button');
        chip.className = 'suggestion';
        chip.type = 'button';
        chip.textContent = text;
        chip.addEventListener('click', () => {
            els.input.value = text;
            autoGrow();
            els.input.focus();
        });
        wrap.append(chip);
    });
    hero.append(wrap);
    return hero;
}

function newChat() {
    state.currentId = null;
    state.editing = null;
    els.topTitle.textContent = 'New chat';
    clearAttachments();
    els.chatBox.textContent = '';
    els.chatBox.append(buildHero());
    syncExportButton();
    loadSidebar();
    els.input.focus();
}

function syncExportButton() {
    const btn = document.getElementById('export-btn');
    if (btn) btn.disabled = !state.currentId;
}

async function exportChat() {
    if (!state.currentId) { toast('Open a saved chat to export it.', true); return; }
    try {
        const res = await fetch(`/api/chats/${state.currentId}/export`);
        if (!res.ok) throw new Error('Export failed');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const match = /filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '');
        link.href = url;
        link.download = match ? match[1] : 'chat.md';
        document.body.append(link);
        link.click();
        link.remove();
        // Revoke on the next tick, or Safari cancels the download.
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('Exported');
    } catch (err) {
        toast(err.message, true);
    }
}

/* ---------------------------------------------------------------------------
   Attachments

   Files are uploaded to the server as soon as they are chosen, not when the
   message is sent. The server does the extraction (PDF and DOCX cannot be read
   in the browser) and returns a descriptor; the message then references it by
   id. This keeps the chat payload small and lets us show real errors per file.
--------------------------------------------------------------------------- */
const MAX_FILES = 5;

function fileIcon(kind, name) {
    if (kind === 'image') return 'image';
    if (/\.pdf$/i.test(name)) return 'picture_as_pdf';
    if (/\.docx?$/i.test(name)) return 'description';
    if (/\.(csv|tsv|xlsx?|json|ya?ml|xml)$/i.test(name)) return 'table';
    return 'code';
}

function humanSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderTray() {
    els.tray.textContent = '';
    state.attachments.forEach((att) => els.tray.append(attachmentCard(att)));
}

function attachmentCard(att) {
    const card = document.createElement('div');
    card.className = 'att-card' + (att.pending ? ' uploading' : '');

    const thumb = document.createElement(att.thumbnail ? 'img' : 'div');
    thumb.className = 'att-thumb';
    if (att.thumbnail) {
        thumb.src = att.thumbnail;
        thumb.alt = att.name;
    } else {
        thumb.append(icon(fileIcon(att.kind, att.name)));
    }

    const meta = document.createElement('div');
    meta.className = 'att-meta';
    const name = document.createElement('div');
    name.className = 'att-name';
    name.textContent = att.name;
    name.title = att.name;
    const sub = document.createElement('div');
    sub.className = 'att-sub';
    sub.textContent = att.pending
        ? 'Uploading\u2026'
        : [humanSize(att.size), att.pages ? att.pages + ' pages' : '', att.truncated ? 'truncated' : '']
            .filter(Boolean).join(' \u00B7 ');
    meta.append(name, sub);

    card.append(thumb, meta);

    if (att.pending) {
        const bar = document.createElement('div');
        bar.className = 'att-bar';
        bar.append(document.createElement('span'));
        card.append(bar);
    } else {
        const remove = document.createElement('button');
        remove.className = 'att-remove';
        remove.type = 'button';
        remove.textContent = '\u00D7';
        remove.setAttribute('aria-label', 'Remove ' + att.name);
        remove.addEventListener('click', () => {
            state.attachments = state.attachments.filter((a) => a !== att);
            renderTray();
        });
        card.append(remove);
    }
    return card;
}

function clearAttachments() {
    state.attachments = [];
    renderTray();
    els.filePicker.value = '';
}

async function uploadFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;

    const room = MAX_FILES - state.attachments.length;
    if (room <= 0) { toast(`You can attach ${MAX_FILES} files per message.`, true); return; }
    const batch = files.slice(0, room);
    if (files.length > room) toast(`Only the first ${room} were added.`, true);

    // Optimistic placeholders so the user sees something immediately.
    const placeholders = batch.map((f) => {
        const item = { id: null, name: f.name, kind: f.type.startsWith('image/') ? 'image' : 'file',
                       size: f.size, pending: true };
        state.attachments.push(item);
        return item;
    });
    renderTray();

    const form = new FormData();
    batch.forEach((f) => form.append('files', f, f.name));

    state.uploading++;
    setBusy(state.sending);
    try {
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        let payload = null;
        try { payload = await res.json(); } catch (_) {}

        if (!res.ok && !(payload && payload.rejected)) {
            throw new Error((payload && payload.error) || `Upload failed (${res.status})`);
        }

        // Drop placeholders, insert what the server actually accepted.
        state.attachments = state.attachments.filter((a) => !placeholders.includes(a));
        (payload.attachments || []).forEach((a) => state.attachments.push(a));
        renderTray();

        // Rejections take priority over the success message: accepted files are
        // already visible in the tray, but a refusal is only ever shown here.
        const rejected = payload.rejected || [];
        const accepted = payload.attachments || [];
        if (rejected.length) {
            const first = `${rejected[0].name}: ${rejected[0].error}`;
            toast(rejected.length > 1 ? `${first} (+${rejected.length - 1} more)` : first, true);
        } else if (accepted.length) {
            toast(`${accepted.length} file${accepted.length > 1 ? 's' : ''} attached`);
        }
    } catch (err) {
        state.attachments = state.attachments.filter((a) => !placeholders.includes(a));
        renderTray();
        toast(err.message, true);
    } finally {
        state.uploading--;
        setBusy(state.sending);
        els.filePicker.value = '';
        els.input.focus();
    }
}

/* Drag and drop anywhere on the window. */
let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    dragDepth++;
    els.veil.classList.add('show');
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) els.veil.classList.remove('show');
});
window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    els.veil.classList.remove('show');
    if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

/* Paste a screenshot straight into the composer. */
els.input.addEventListener('paste', (e) => {
    const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
    const files = items.filter((i) => i.kind === 'file').map((i) => i.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); uploadFiles(files); }
});

/* Lightbox for image attachments in the transcript. */
els.lightbox.addEventListener('click', () => els.lightbox.classList.remove('show'));
function openLightbox(src, alt) {
    const img = els.lightbox.querySelector('img');
    img.src = src;
    img.alt = alt || 'Attached image';
    els.lightbox.classList.add('show');
}

/* ---------------------------------------------------------------------------
   Input behaviour
--------------------------------------------------------------------------- */
function autoGrow() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 200) + 'px';
}

els.input.addEventListener('input', autoGrow);
els.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {   // Shift+Enter for a newline
        e.preventDefault();
        send();
    }
});

els.submit.addEventListener('click', send);
els.search.addEventListener('input', (e) => onSearch(e.target.value));
els.filePicker.addEventListener('change', (e) => uploadFiles(e.target.files));
els.tempMode.addEventListener('change', () => {
    toast(els.tempMode.checked ? 'Temporary chat: nothing will be saved' : 'Chats will be saved again');
});

document.getElementById('menu-toggle').addEventListener('click', () => toggleSidebar());
document.getElementById('new-chat-btn').addEventListener('click', newChat);

document.getElementById('attach-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    els.fileMenu.style.display = els.fileMenu.style.display === 'flex' ? 'none' : 'flex';
});
els.fileMenu.querySelectorAll('button[data-accept]').forEach((btn) => {
    btn.addEventListener('click', () => {
        els.filePicker.multiple = true;
        els.filePicker.accept = btn.dataset.accept;
        els.filePicker.click();
        els.fileMenu.style.display = 'none';
    });
});

els.stop.addEventListener('click', stopGenerating);
document.getElementById('theme-btn').addEventListener('click', toggleTheme);
document.querySelectorAll('.mode-opt').forEach((btn) => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
});
document.getElementById('export-btn').addEventListener('click', exportChat);
document.getElementById('help-btn').addEventListener('click', showShortcuts);

function closeAllMenus() {
    document.querySelectorAll('.action-menu, .popup-menu').forEach((m) => { m.style.display = 'none'; });
}
document.addEventListener('click', closeAllMenus);

/* Sidebar behaves as an overlay drawer on narrow screens. */
const isNarrow = () => window.matchMedia('(max-width: 820px)').matches;

function toggleSidebar(force) {
    const collapsed = els.sidebar.classList.contains('collapsed');
    const show = force === undefined ? collapsed : force;
    els.sidebar.classList.toggle('collapsed', !show);
    document.getElementById('sidebar-scrim').classList.toggle('show', show && isNarrow());
}

document.getElementById('sidebar-scrim').addEventListener('click', () => toggleSidebar(false));
if (isNarrow()) els.sidebar.classList.add('collapsed');
window.addEventListener('resize', () => {
    if (!isNarrow()) document.getElementById('sidebar-scrim').classList.remove('show');
});

/* Close the drawer after picking a chat on mobile, or it covers the answer. */
els.recentList.addEventListener('click', (e) => {
    if (isNarrow() && e.target.closest('.sidebar-btn')) toggleSidebar(false);
});

document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);

    if (e.key === 'Escape') {
        if (els.backdrop.classList.contains('show')) { closeDialog(null); return; }
        if (els.lightbox.classList.contains('show')) { els.lightbox.classList.remove('show'); return; }
        if (state.editing) { cancelEdit(); return; }
        if (state.sending) { stopGenerating(); return; }
        closeAllMenus();
        return;
    }

    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); els.search.focus(); els.search.select(); return; }
    if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); return; }
    if (mod && e.key.toLowerCase() === 'j') { e.preventDefault(); toggleTheme(); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'o') { e.preventDefault(); newChat(); return; }
    if (e.key === '?' && !typing) { e.preventDefault(); showShortcuts(); return; }
    if (e.key === '/' && !typing) { e.preventDefault(); els.input.focus(); }
});

/* --------------------------------------------------------------------------- */
initTheme();
initMode();
syncExportButton();

// Ask the server what it supports rather than assuming.
loadBudget();
api('/api/config').then((cfg) => {
    state.streaming = !!cfg.streaming;
    if (cfg.free_rpd) { budget.limit = cfg.free_rpd; renderBudget(); }
}).catch(() => { state.streaming = false; });
if (!document.getElementById('hero-container')) els.chatBox.append(buildHero());
loadSidebar();
if (!isNarrow()) els.input.focus();
</script>
</body>
</html>
